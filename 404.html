<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pagina non trovata | Next Siteo</title>
  <meta name="description" content="Questa pagina non esiste o ha cambiato indirizzo. Tornate alla home di Next Siteo.">
  <meta name="robots" content="noindex">
  <!--
    GitHub Pages mostra questa pagina per qualsiasi indirizzo sbagliato, anche dentro cartelle:
    per questo stili e logo sono qui dentro e il link alla home usa l'indirizzo completo.
    URL SEGNAPOSTO: sostituire "https://NOMEUTENTE.github.io/NOMEREPO/" (vedi README, punto 7).
  -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231F45E0'/%3E%3Cpath d='M10.5 22V10l11 12V10' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: #f6f7f9;
      color: #121418;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.6;
    }
    main { width: min(100%, 34rem); }
    .logo { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 40px; font-weight: 800; font-size: 1.1875rem; letter-spacing: -0.03em; }
    .logo svg { width: 30px; height: 30px; }
    .code { margin: 0; color: #1f45e0; font-weight: 800; font-size: 0.875rem; letter-spacing: 0.08em; text-transform: uppercase; }
    h1 { margin: 8px 0 12px; font-size: clamp(2rem, 1.5rem + 2.5vw, 3rem); line-height: 1.1; letter-spacing: -0.035em; }
    p { margin: 0 0 28px; color: #5a6070; font-size: 1.0625rem; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 24px;
      border-radius: 999px; background: #1f45e0; color: #fff; font-weight: 700; text-decoration: none;
    }
    .btn:hover { background: #1636b6; }
    :focus-visible { outline: 3px solid #1f45e0; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="logo">
      <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect width="32" height="32" rx="9" fill="#1F45E0"/><path d="M10.5 22V10l11 12V10" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Next Siteo
    </div>
    <p class="code">Errore 404</p>
    <h1>Questa pagina non c'è.</h1>
    <p>Forse l'indirizzo è sbagliato o la pagina è stata spostata. Dalla home trovate servizi, lavori e contatti.</p>
    <a class="btn" href="https://NOMEUTENTE.github.io/NOMEREPO/" data-home>Torna alla home</a>
  </main>
  <script>
    // Se l'indirizzo segnaposto non è ancora stato sostituito, prova a ricavare la home dall'indirizzo attuale
    (function () {
      var a = document.querySelector('[data-home]');
      if (a.getAttribute('href').indexOf('NOMEUTENTE') === -1) return;
      var parts = location.pathname.split('/').filter(Boolean);
      var base = /\.github\.io$/.test(location.hostname) && parts.length > 1 ? '/' + parts[0] + '/' : '/';
      a.setAttribute('href', base);
    })();
  </script>
</body>
</html>
